<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Reminder - Google Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container-main {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        .btn-voice {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .btn-voice.listening {
            background: #dc3545;
            color: white;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        .btn-voice:not(.listening) {
            background: #667eea;
            color: white;
        }
        .btn-voice:hover:not(.listening) {
            background: #764ba2;
        }
        .transcript-section {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .transcript-section.show {
            display: block;
        }
        .reminder-section {
            margin: 20px 0;
            padding: 20px;
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            display: none;
        }
        .reminder-section.show {
            display: block;
        }
        .reminder-field {
            margin: 10px 0;
        }
        .reminder-field label {
            font-weight: 600;
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }
        .reminder-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-group button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-create {
            background: #28a745;
            color: white;
        }
        .btn-create:hover {
            background: #218838;
        }
        .btn-cancel {
            background: #6c757d;
            color: white;
        }
        .btn-cancel:hover {
            background: #5a6268;
        }
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        .status-message.show {
            display: block;
        }
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .auth-section {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .auth-status {
            font-size: 14px;
            color: #666;
            margin-top: 10px;
        }
        .auth-status.authenticated {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container-main">
        <h1>🎤 Voice Calendar Reminder</h1>
        
        <div class="auth-section">
            <button id="googleAuthBtn" class="btn btn-primary" style="width: 100%;">Sign in with Google</button>
            <div id="authStatus" class="auth-status">Not authenticated</div>
        </div>

        <button id="voiceBtn" class="btn-voice">🎙️ Click to Speak</button>
        
        <div id="statusMessage" class="status-message"></div>
        
        <div id="transcriptSection" class="transcript-section">
            <label>Your Voice Command:</label>
            <p id="transcriptText" style="margin: 0; color: #666;"></p>
        </div>

        <div id="reminderSection" class="reminder-section">
            <label style="margin: 0 0 15px 0; font-size: 16px;">Parsed Reminder:</label>
            
            <div class="reminder-field">
                <label>Title</label>
                <input type="text" id="reminderTitle" readonly>
            </div>
            
            <div class="reminder-field">
                <label>Date</label>
                <input type="date" id="reminderDate">
            </div>
            
            <div class="reminder-field">
                <label>Time</label>
                <input type="time" id="reminderTime">
            </div>
            
            <div class="reminder-field">
                <label>Description (optional)</label>
                <input type="text" id="reminderDescription" placeholder="Add details...">
            </div>
            
            <div class="btn-group">
                <button class="btn-create" onclick="createReminder()">✓ Create Reminder</button>
                <button class="btn-cancel" onclick="reset()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Google Calendar API Configuration
        const GOOGLE_CLIENT_ID = '556580701069-ehvq3hvls048vj0ep6letj7ktgeposa0.apps.googleusercontent.com';
        const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/calendar';
        
        let recognition;
        let accessToken = null;
        let parsedReminder = null;

        // Initialize Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.language = 'en-US';
        }

        // Google Sign-In
        function handleCredentialResponse(response) {
            accessToken = response.credential;
            const decoded = parseJwt(response.credential);
            document.getElementById('authStatus').textContent = `✓ Signed in as ${decoded.email}`;
            document.getElementById('authStatus').classList.add('authenticated');
            document.getElementById('googleAuthBtn').disabled = true;
            document.getElementById('googleAuthBtn').textContent = '✓ Signed in';
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map((c) => {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById('googleAuthBtn'),
                { theme: 'outline', size: 'large' }
            );
        };

        // Voice Recognition
        document.getElementById('voiceBtn').addEventListener('click', () => {
            if (!recognition) {
                showStatus('Web Speech API not supported in your browser', 'error');
                return;
            }
            
            const btn = document.getElementById('voiceBtn');
            btn.classList.add('listening');
            btn.textContent = '🎙️ Listening...';
            recognition.start();
        });

        recognition.onend = () => {
            const btn = document.getElementById('voiceBtn');
            btn.classList.remove('listening');
            btn.textContent = '🎙️ Click to Speak';
        };

        recognition.onresult = async (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            
            if (event.isFinal) {
                document.getElementById('transcriptText').textContent = transcript;
                document.getElementById('transcriptSection').classList.add('show');
                
                await parseVoiceCommand(transcript);
            }
        };

        recognition.onerror = (event) => {
            showStatus(`Error: ${event.error}`, 'error');
        };

        async function parseVoiceCommand(transcript) {
            showStatus('Parsing reminder...', 'loading');
            
            try {
                const response = await fetch('http://localhost:8000/parse-reminder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ transcript })
                });
                
                if (!response.ok) throw new Error('Failed to parse reminder');
                
                parsedReminder = await response.json();
                
                document.getElementById('reminderTitle').value = parsedReminder.title;
                document.getElementById('reminderDate').value = parsedReminder.date;
                document.getElementById('reminderTime').value = parsedReminder.time;
                document.getElementById('reminderDescription').value = parsedReminder.description || '';
                
                document.getElementById('reminderSection').classList.add('show');
                showStatus('', '');
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        async function createReminder() {
            if (!accessToken) {
                showStatus('Please sign in with Google first', 'error');
                return;
            }

            const title = document.getElementById('reminderTitle').value;
            const date = document.getElementById('reminderDate').value;
            const time = document.getElementById('reminderTime').value;
            const description = document.getElementById('reminderDescription').value;

            const startDateTime = `${date}T${time}:00`;
            const endDateTime = new Date(new Date(startDateTime).getTime() + 60*60000).toISOString();

            const event = {
                summary: title,
                description: description,
                start: {
                    dateTime: startDateTime,
                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                },
                end: {
                    dateTime: new Date(new Date(startDateTime).getTime() + 60*60000).toISOString().split('.')[0],
                    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
                }
            };

            showStatus('Creating calendar event...', 'loading');

            try {
                const response = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(event)
                });

                if (!response.ok) throw new Error('Failed to create event');

                showStatus('✓ Reminder created successfully!', 'success');
                setTimeout(reset, 2000);
            } catch (error) {
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        function reset() {
            document.getElementById('transcriptSection').classList.remove('show');
            document.getElementById('reminderSection').classList.remove('show');
            document.getElementById('statusMessage').classList.remove('show');
            parsedReminder = null;
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message';
            if (message) {
                statusEl.classList.add('show', type);
            }
        }
    </script>
</body>
</html>
